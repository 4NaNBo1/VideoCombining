name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg into bin/
        run: |
          brew install ffmpeg
          mkdir -p bin
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" bin/
          cp "$(brew --prefix ffmpeg)/bin/ffprobe" bin/
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Build app
        run: python -m PyInstaller VideoCombining.spec --noconfirm

      - name: Package DMG
        run: |
          hdiutil create -volname "VideoCombining" -srcfolder dist/VideoCombining.app -ov \
            -format UDZO "VideoCombining-${{ github.ref_name }}-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCombining-macOS
          path: VideoCombining-${{ github.ref_name }}-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ffmpeg.zip"
          Expand-Archive -Force "$env:TEMP\ffmpeg.zip" "$env:TEMP\ffmpeg-unpack"
          $root = Get-ChildItem "$env:TEMP\ffmpeg-unpack" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" bin\
          Copy-Item "$($root.FullName)\bin\ffprobe.exe" bin\

      - name: Build exe
        run: python -m PyInstaller VideoCombining.spec --noconfirm

      - name: Stage release exe
        shell: pwsh
        run: Copy-Item dist\VideoCombining.exe "VideoCombining-${{ github.ref_name }}-Windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCombining-Windows
          path: VideoCombining-${{ github.ref_name }}-Windows.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoCombining-macOS
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: VideoCombining-Windows
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: VideoCombining ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
